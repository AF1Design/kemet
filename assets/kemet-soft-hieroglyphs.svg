<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <g fill="none" stroke="#D4AF37" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.35">
    <!-- Ankh Symbol 1 -->
    <g transform="translate(40, 40)">
      <ellipse cx="20" cy="18" rx="10" ry="14" />
      <line x1="20" y1="32" x2="20" y2="60" />
      <line x1="6" y1="42" x2="34" y2="42" />
    </g>

    <!-- Eye of Horus Symbol -->
    <g transform="translate(180, 30)">
      <path d="M 5 25 C 20 10, 40 10, 55 25 C 40 40, 20 40, 5 25 Z" />
      <circle cx="30" cy="25" r="7" fill="#D4AF37" fill-opacity="0.25" />
      <path d="M 30 32 L 30 48 C 22 52, 18 45, 15 42" />
      <path d="M 42 30 C 48 40, 52 45, 55 50" />
    </g>

    <!-- Winged Sun Disc Symbol -->
    <g transform="translate(110, 140)">
      <circle cx="40" cy="20" r="12" fill="#D4AF37" fill-opacity="0.2" />
      <path d="M 28 20 C 15 10, 0 15, -20 18 C 0 25, 15 25, 28 20 Z" />
      <path d="M 52 20 C 65 10, 80 15, 100 18 C 80 25, 65 25, 52 20 Z" />
    </g>

    <!-- Pharaoh Athlete / Running Pose Silhouette -->
    <g transform="translate(40, 190)">
      <circle cx="20" cy="10" r="6" />
      <path d="M 20 16 L 20 38 L 10 58" />
      <path d="M 20 38 L 32 55" />
      <path d="M 20 22 L 8 32" />
      <path d="M 20 22 L 34 28" />
    </g>

    <!-- Pyramid & Ankh Combo -->
    <g transform="translate(200, 200)">
      <polygon points="25,5 5,45 45,45" />
      <ellipse cx="25" cy="22" rx="5" ry="7" />
    </g>
  </g>
</svg>
