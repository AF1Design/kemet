<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <g fill="none" stroke="#D4AF37" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.34">
    
    <!-- Ankh Key of Life Symbol 1 (مفتاح الحياة الأصلي) -->
    <g transform="translate(35, 35)">
      <ellipse cx="20" cy="18" rx="10" ry="14" />
      <line x1="20" y1="32" x2="20" y2="58" />
      <line x1="8" y1="40" x2="32" y2="40" />
    </g>

    <!-- Eye of Horus Symbol (عين حورس الفرعونية) -->
    <g transform="translate(175, 30)">
      <path d="M 5 25 C 20 10, 40 10, 55 25 C 40 40, 20 40, 5 25 Z" />
      <circle cx="30" cy="25" r="6" fill="#D4AF37" fill-opacity="0.25" />
      <path d="M 30 31 L 30 46 C 22 50, 18 43, 15 40" />
      <path d="M 42 29 C 48 38, 52 43, 55 48" />
    </g>

    <!-- Winged Sun Disc Symbol (قرص الشمس المجنح) -->
    <g transform="translate(105, 135)">
      <circle cx="40" cy="20" r="11" fill="#D4AF37" fill-opacity="0.2" />
      <path d="M 29 20 C 15 10, 0 15, -18 18 C 0 25, 15 25, 29 20 Z" />
      <path d="M 51 20 C 65 10, 80 15, 98 18 C 80 25, 65 25, 51 20 Z" />
    </g>

    <!-- Ankh Key of Life Symbol 2 (مفتاح الحياة الثاني) -->
    <g transform="translate(45, 195)">
      <ellipse cx="18" cy="16" rx="9" ry="12" />
      <line x1="18" y1="28" x2="18" y2="52" />
      <line x1="7" y1="35" x2="29" y2="35" />
    </g>

    <!-- Ankh Key of Life Symbol 3 (مفتاح الحياة الثالث مع القاعدة الفرعونية) -->
    <g transform="translate(205, 195)">
      <ellipse cx="20" cy="18" rx="10" ry="14" />
      <line x1="20" y1="32" x2="20" y2="58" />
      <line x1="8" y1="40" x2="32" y2="40" />
      <path d="M 5 58 L 35 58" />
    </g>

  </g>
</svg>
