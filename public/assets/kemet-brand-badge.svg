<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <!-- Smooth Rounded Square Clip Path for Brand Badge -->
    <clipPath id="badge-clip">
      <rect x="20" y="20" width="760" height="760" rx="180" ry="180" />
    </clipPath>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
  </defs>

  <!-- Background Obsidian Card -->
  <rect x="20" y="20" width="760" height="760" rx="180" ry="180" fill="#05070C" stroke="#D4AF37" stroke-width="4" stroke-opacity="0.3" />

  <g clip-path="url(#badge-clip)">
    <!-- Pyramid & Hieroglyphs Background Pattern -->
    <g fill="none" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.25">
      <!-- Pyramids Background Silhouette -->
      <polygon points="400,80 160,540 640,540" />
      <polygon points="560,180 380,540 740,540" />
      <polygon points="240,220 80,540 400,540" />
      
      <!-- Hieroglyphic Waves & Desert Lines -->
      <path d="M 40 580 C 180 540, 360 620, 540 570 C 660 540, 740 580, 760 590" />
      <path d="M 40 640 C 200 600, 380 670, 580 620 C 680 590, 740 630, 760 640" />
      <path d="M 40 700 C 220 660, 420 730, 620 680 C 700 650, 740 690, 760 700" />

      <!-- Soft Ankh Symbols -->
      <g transform="translate(100, 120) scale(1.4)">
        <ellipse cx="20" cy="18" rx="10" ry="14" />
        <line x1="20" y1="32" x2="20" y2="58" />
        <line x1="8" y1="40" x2="32" y2="40" />
      </g>
      <g transform="translate(620, 120) scale(1.4)">
        <ellipse cx="20" cy="18" rx="10" ry="14" />
        <line x1="20" y1="32" x2="20" y2="58" />
        <line x1="8" y1="40" x2="32" y2="40" />
      </g>
    </g>

    <!-- KEMET Emblem Logo (Pharaoh Wings + Ankh) Centerpiece -->
    <g transform="translate(400, 320) scale(1.85)">
      <!-- Ankh Key Center -->
      <path d="M 0 -55 C -12 -55 -18 -38 -18 -22 C -18 -6 -10 8 0 16 C 10 8 18 -6 18 -22 C 18 -38 12 -55 0 -55 Z M 0 -43 C 6 -43 10 -34 10 -22 C 10 -10 6 -4 0 -4 C -6 -4 -10 -10 -10 -22 C -10 -34 -6 -43 0 -43 Z" fill="#FFFFFF" />
      <rect x="-3" y="14" width="6" height="52" fill="#FFFFFF" />
      <rect x="-24" y="24" width="48" height="7" rx="1" fill="#FFFFFF" />

      <!-- Left Pharaoh Wing -->
      <path d="M -26 -10 Q -65 -45 -130 -35 Q -105 -15 -85 0 Q -55 12 -26 18 Z" fill="#FFFFFF" />
      <path d="M -28 5 Q -65 -20 -120 -12 Q -98 8 -78 20 Q -52 30 -28 32 Z" fill="#FFFFFF" />
      <path d="M -30 20 Q -60 5 -105 10 Q -85 28 -68 38 Q -48 45 -30 45 Z" fill="#FFFFFF" />

      <!-- Right Pharaoh Wing -->
      <path d="M 26 -10 Q 65 -45 130 -35 Q 105 -15 85 0 Q 55 12 26 18 Z" fill="#FFFFFF" />
      <path d="M 28 5 Q 65 -20 120 -12 Q 98 8 78 20 Q 52 30 28 32 Z" fill="#FFFFFF" />
      <path d="M 30 20 Q 60 5 105 10 Q 85 28 68 38 Q 48 45 30 45 Z" fill="#FFFFFF" />

      <!-- Nemes Crown Headpiece -->
      <path d="M 0 -85 L -22 -62 L 22 -62 Z" fill="#FFFFFF" />
      <path d="M -18 -60 L -30 -38 L -14 -35 Z" fill="#FFFFFF" />
      <path d="M 18 -60 L 30 -38 L 14 -35 Z" fill="#FFFFFF" />
    </g>

    <!-- Crisp High-Definition Wordmark "K E M E T" -->
    <g transform="translate(400, 560)">
      <text x="0" y="0" text-anchor="middle" font-family="'Syne', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="82" letter-spacing="14" fill="#FFFFFF">KEMET</text>
    </g>
  </g>
</svg>
